[package]
name = "dr-player"
version = "2.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
wry = { version = "0.39", features = ["fullscreen"] }
tao = "0.28"
ico = "0.3"
serde_json = "1"
rand = "0.8"
# One HTTPS GET of one JSON document per launch, so the client is here for its TLS stack and for
# very little else: rustls with ring, which keeps OpenSSL out of a Windows binary that gets shipped
# and installed. Default features off leaves out http2, charset, cookies, the system proxy and the
# json feature, the last of which is redundant because serde_json is already a dependency and does
# the parsing. TLS roots still work through it; the system-proxy feature only reads the machine's
# WPAD settings, and HTTP_PROXY and HTTPS_PROXY are honoured without it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
winres = "0.1"